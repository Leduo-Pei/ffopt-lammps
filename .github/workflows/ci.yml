name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install ".[full,dev]"
      - name: Run regression tests
        env:
          FFOPT_CONFIG_DIR: ${{ runner.temp }}/ffopt-config
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify installed project resources
        run: python tests/check_wheel.py dist/*.whl
