name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install ".[full,dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint Python
        run: python -m ruff check .
      - name: Run regression tests
        env:
          FFOPT_CONFIG_DIR: ${{ runner.temp }}/ffopt-config
        run: python -m pytest -q
      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build
      - name: Verify installed project resources
        if: matrix.python-version == '3.11'
        run: python tests/check_wheel.py dist/*.whl
      - name: Smoke test the built wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          ffopt --version
          ffopt self-test --prepare-only --workdir "${RUNNER_TEMP}/ffopt-wheel-self-test"
      - name: Verify source distribution
        if: matrix.python-version == '3.11'
        run: python tests/check_sdist.py dist/*.tar.gz
