name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install ".[full,dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run regression tests
        env:
          FFOPT_CONFIG_DIR: ${{ runner.temp }}/ffopt-config
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed project resources
        run: python tests/check_wheel.py dist/*.whl
      - name: Smoke test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          ffopt --version
          ffopt self-test --prepare-only --workdir "${RUNNER_TEMP}/ffopt-wheel-self-test"
      - name: Verify source distribution
        run: python tests/check_sdist.py dist/*.tar.gz
      - name: Write release checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag --generate-notes --prerelease
