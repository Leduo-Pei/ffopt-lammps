include:
  - btah_common.yaml

project:
  name: "btah_fix_sigma"
  default_machine: "local"
  run_root: "runs/btah_fix_sigma"

modules:
  # 27 free dimensions: epsilon and 13 independent charges; sigma is fixed.
  system: "configs/systems/btah_822_fix_si.yaml"

stages:
  sample:
    source: "auto"
    n_points: 2000
    seeds: [101, 202, 303]
    elite_centers: 72
    radii: [0.020, 0.040, 0.080, 0.160]
    global_fraction: 0.50
    design_seed: 20260714
  # NN inputs are intentionally omitted until the corrected CHARMM BO and
  # three-seed sampling stages finish. ffopt.py will then discover the newest
  # compatible run under this clean project root.

overrides:
  nn:
    # The three-seed benchmark shows that one model is not optimal for every
    # response surface. These overrides retain the ANN for density and
    # sublimation, while smooth local models handle the cell lengths.
    property_models:
      b:
        model: "polynomial_ridge"
        training_source: "core_only"
      c:
        model: "polynomial_ridge"
        training_source: "core_only"
    # A shared representation uses correlations among all five labels, while
    # only its strongest outputs replace the corresponding single-task ANN.
    multitask:
      enabled: true
      use_for_properties: ["a", "density"]
      hidden_layers: [128, 128, 64]
      activation: "silu"
      ensemble_size: 5
      learning_rate: 1.0e-3
      weight_decay: 1.0e-4
      max_epochs: 3000
      patience: 250
