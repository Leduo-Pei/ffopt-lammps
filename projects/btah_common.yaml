# Shared BTAH workflow modules. Select a parameter regime in project.yaml.

schema_version: 1

modules:
  properties:
    - "configs/properties/bulk_runtime.yaml"
    - "configs/properties/bulk_targets.yaml"
    - "configs/properties/sublimation_proxy.yaml"
    - "configs/properties/no_adsorption.yaml"
  methods:
    bo: "configs/methods/bo/turbo.yaml"
    nn: "configs/methods/nn/mlp_ensemble.yaml"
    al: "configs/methods/al/uncertainty_sampling.yaml"
  machines:
    local: "configs/machines/local.yaml"
    cluster: "configs/machines/cluster.yaml"

overrides:
  workflow:
    active_properties: ["bulk_npt", "sublimation_proxy"]
