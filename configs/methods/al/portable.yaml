# Molecule-independent active-learning defaults for scaffolded projects.
# The stable-core envelope prevents immediate extrapolation across the full
# manual parameter box; project evidence should determine tighter cutoffs.

include:
  - uncertainty_sampling.yaml

active_learning:
  sampling_domain: "core_envelope"
  sampling_objective_max: 1.0
  local_elite_objective_max: 1.0
  local_sampling_fraction: 0.75
  local_radii: [0.01, 0.025, 0.05]
  direct_objective_max: 2.0
  uncertainty_threshold: 0.03
