# Active-learning module.
#
# AL is optional. You can run only BO, inspect results, then later run:
#   python ffopt.py nn
#   python ffopt.py al

active_learning:
  enabled: true
  # Number of AL rounds after the initial BO+NN stages.
  n_rounds: 2
  # Number of new LAMMPS evaluations added per AL round.
  n_candidates_per_round: 20
  # Stop early when ensemble uncertainty drops below this threshold.
  uncertainty_threshold: 0.03
  # Candidate pool generator: "sobol" is the recommended default.
  candidate_sampling: "sobol"
  # "core_envelope" restricts proposals to the 1%-99% parameter envelope of
  # stability-audited core rows, expanded by envelope_margin. Use "global"
  # only when deliberately exploring the full manually defined parameter box.
  sampling_domain: "core_envelope"
  # A tighter subset than the NN training core is used to define where AL
  # explores. The NN still trains on core_objective_max=0.03 plus its buffer.
  sampling_objective_max: 0.02
  # Fractional expansion beyond the observed core envelope on each side.
  envelope_margin: 0.15
  # Number of candidate parameter sets scored by the NN ensemble each round.
  n_candidate_pool: 16384
  # Fraction of the pool generated by perturbing validated low-objective rows.
  # The remainder is Sobol-sampled across the stable-core envelope.
  local_sampling_fraction: 0.75
  # Rows at or below this objective can act as local perturbation centres.
  local_elite_objective_max: 0.03
  # Gaussian perturbation radii as fractions of each envelope dimension.
  local_radii: [0.005, 0.015, 0.04]
  # Fraction of selected LAMMPS jobs devoted to conservative exploitation.
  exploitation_fraction: 0.80
  # Penalize uncertain predictions when minimizing the surrogate objective.
  uncertainty_penalty: 0.50
  # Exploration candidates must also lie inside this predicted-objective
  # quantile, preventing pure uncertainty chasing into poor basins.
  promising_quantile: 0.20
  # A focused hybrid must not silently become the generic MLP after round 1.
  # Retrain the focused model explicitly between separate AL campaigns.
  preserve_focused_hybrid: true
  # Blend a direct ExtraTrees objective predictor with the property-network
  # objective. This restores information from targets excluded from NN training
  # (notably alpha/beta/gamma) and prevents near-zero ANN extrapolations.
  direct_objective_weight: 0.65
  # Train the acquisition-only objective model in the useful local basin.
  direct_objective_max: 0.25
  # Higher values bias selection toward low predicted objective; lower values
  # chase uncertainty more aggressively.
  objective_bias: 0.25
