# BO method module: SAASBO.
#
# Designed for high-dimensional spaces with sparse relevant dimensions. This is
# more expensive than TuRBO, so use it for focused studies or cluster runs.

include:
  - turbo.yaml

optimization:
  method: "saasbo"
  n_initial: 48
  n_bo_iterations: 200
  saasbo:
    num_samples: 256
    warmup_steps: 512

