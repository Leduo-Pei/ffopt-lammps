# NN surrogate module: ANN/MLP ensemble.
#
# This is the default neural-network stage. Override from CLI without editing:
#   ffopt nn
#
# Alternative model modules can live next to this file and be selected by
# include or by the --model CLI flag.

nn:
  enabled: true
  # Surrogate backend. "mlp_ensemble" is an ANN ensemble. Other supported
  # values include "gp", "random_forest", and "xgboost" when their modules or
  # CLI overrides are used.
  model: "mlp_ensemble"
  # Optional per-property overrides may select a different backend and data
  # source without replacing the ANN for every target. Supported backends are
  # mlp_ensemble, svr_rbf, polynomial_ridge, extra_trees, gp, random_forest and
  # xgboost. training_source is core_buffer or core_only. Example:
  # property_models:
  #   c: {model: "polynomial_ridge", training_source: "core_only"}
  property_models: {}
  # Optional shared multi-property ANN. It learns every active output jointly,
  # but only replaces properties listed in use_for_properties. Project-level
  # benchmarks should select those outputs; disabled is the portable default.
  multitask:
    enabled: false
    use_for_properties: []
    hidden_layers: [128, 128, 64]
    activation: "silu"
    dropout: 0.0
    ensemble_size: 5
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    max_epochs: 3000
    patience: 250
  # Adds hand-built LJ/charge cross features. The BTAH 1200-point benchmark
  # performed better with the 41 raw parameters, so false is the default.
  physics_features: false
  # Append the charge removed by the neutrality constraint as one deterministic
  # NN input. This gives 42 model columns but still only 41 independent degrees
  # of freedom; it does not enable the much larger cross-feature expansion.
  derived_charge_feature: true
  # Number of independently initialized neural networks. Larger values improve
  # uncertainty estimates but increase training time.
  ensemble_size: 8
  # Hidden-layer widths for each MLP member.
  hidden_layers: [256, 128, 128, 64]
  # Activation function used in MLPs. "silu" is smooth and works well here.
  activation: "silu"
  # Legacy percentage cutoff. It is ignored by core_buffer mode below. Keep it
  # at 1.0; selecting only 5% of a 144-row audit leaves too little 41-D data.
  train_top_fraction: 1.0
  # Used only by legacy data mode. core_buffer explicitly loads both files.
  prefer_stable_results: true

  training_data:
    # "core_buffer" combines low-noise stability means with a wider set of BO
    # rows that teaches the local response slope. "legacy" reads one CSV and
    # optionally applies train_top_fraction.
    mode: "core_buffer"
    # Stable candidate means at or below this objective define the learnable
    # NN validation domain. BTAH validation found 0.03 to be the useful core.
    core_objective_max: 0.03
    # Raw BO rows at or below this value provide a surrounding trend buffer.
    # 0.075 was better than 0.03, 0.05, and 0.10 in the BTAH benchmark.
    buffer_objective_max: 0.075
    # Integer influence of each low-noise stable mean. Repetition is group-safe:
    # identical parameter sets can never cross train/validation/test partitions.
    core_weight: 6
    # Optional stable candidate-mean CSV files or glob patterns. Paths may be
    # absolute or relative to cwd, the BO directory, or its parent. Example:
    #   - "local_sampling_BTAH_822_1200/local_results.csv"
    # Every file must contain all properties active in the selected recipe.
    additional_core_files: []
  # Exclude noisy or weakly useful properties from NN training while keeping
  # them available in BO outputs. Empty list means train all active targets.
  exclude_properties: ["alpha", "beta", "gamma_ang"]
  # Optimizer hyperparameters.
  learning_rate: 5.0e-4
  # "huber" is robust to the remaining noisy single-seed BO labels. Use "mse"
  # only for a uniformly low-noise training set.
  loss: "huber"
  # AdamW L2 regularization. Increase cautiously if validation overfits.
  weight_decay: 1.0e-4
  batch_size: 128
  max_epochs: 1500
  early_stopping_patience: 150
  # Data split fractions among successful BO rows used for NN training.
  val_fraction: 0.15
  test_fraction: 0.10
  optimize:
    # Number of multi-start optimizations on the trained surrogate.
    n_restarts: 10
    method: "L-BFGS-B"
