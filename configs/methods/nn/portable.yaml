# Molecule-independent ANN defaults for newly scaffolded projects.
# Objective cutoffs are deliberately broad; narrow them after plotting the
# stable sampling distribution for the new system.

include:
  - mlp_ensemble.yaml

nn:
  ensemble_size: 5
  hidden_layers: [128, 128, 64]
  exclude_properties: []
  max_epochs: 1200
  early_stopping_patience: 150
  training_data:
    mode: "core_buffer"
    core_objective_max: 1.0
    buffer_objective_max: 2.0
    core_weight: 3
    additional_core_files: []
