# BTAH 822 system definition.
#
# This file should contain only chemistry/topology-level information:
#   - system name and structural labels
#   - data files that define the molecular crystal
#   - atom type labels, masses, and optimisable LJ/charge ranges
#   - charge constraints and pair mixing rules
#
# For a new material, copy this file and edit atom_types plus data paths.

manifest:
  system_name: "BTAH_822"
  crystal_structure: "molecular"
  surface_facet: "none"
  data_files:
    bulk: "data/bulk/BTAH_822_bulk.data"

pair_params:
  mixing_rule: "geometric"
  explicit_pairs: []
  derived_params: []

charge:
  enabled: true
  kspace_accuracy: 1.0e-5
  neutrality_constraint:
    enabled: true
    derive_from_type: 1        # bhN1 charge is derived from total neutrality.
    # Per-molecule type counts used only to expose the derived charge to NN
    # physics features. They must match the composition in the bulk data file.
    feature_type_counts: {bhN1: 1, bhHn: 1, bhN2: 1, bhN3: 1, bhC2: 1, bhH2: 1, bhC1: 1, bhH1: 1, bhC6: 1, bhH6: 1, bhC5: 1, bhH5: 1, bhC4: 1, bhC3: 1}
  constraints:
    abs_max: 1.0               # reject any resolved |q| >= this value.

# Parameter ranges are centred on the current reasonable BTAH reference set.
# To reduce dimensionality, replace any min/max block with a fixed number, or
# use a formula string understood by lammps_interface._resolve_params().
atom_types:
  - {type: 1,  label: bhN1, mass: 14.007,   params: {epsilon: {min: 0.1000000071, max: 0.4000000284, init: 0.2000000142}, sigma: {min: 2.8018764520, max: 3.7907740232, init: 3.2963252376}, charge: {min: -1.0, max: -0.543}}}
  - {type: 2,  label: bhHn, mass: 1.008,    params: {epsilon: {min: 0.0236756017, max: 0.0947024066, init: 0.0473512033}, sigma: {min: 0.3383735798, max: 0.4577995502, init: 0.3980865645}, charge: {min: 0.184, max: 0.784}}}
