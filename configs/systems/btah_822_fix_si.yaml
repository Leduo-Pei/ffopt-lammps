# BTAH 822 optimization with fixed sigma and free epsilon/charge.
#
# Epsilon uses the same bounds as the full 41D project, centred on the
# validated BTAH_v2.0 CHARMM reference. Sigma is fixed at that same reference.
# bhN1 charge is derived from molecular neutrality, leaving 14 epsilon +
# 13 charge = 27 independent BO dimensions.

manifest:
  system_name: "BTAH_822_fix_si"
  crystal_structure: "molecular"
  surface_facet: "none"
  data_files:
    bulk: "data/bulk/BTAH_822_bulk.data"

pair_params:
  mixing_rule: "geometric"
  explicit_pairs: []
  derived_params: []

charge:
  enabled: true
  kspace_accuracy: 1.0e-5
  neutrality_constraint:
    enabled: true
    derive_from_type: 1
    # BTAH contains one atom of every listed type per molecule.
    feature_type_counts: {bhN1: 1, bhHn: 1, bhN2: 1, bhN3: 1, bhC2: 1, bhH2: 1, bhC1: 1, bhH1: 1, bhC6: 1, bhH6: 1, bhC5: 1, bhH5: 1, bhC4: 1, bhC3: 1}
  constraints:
    abs_max: 1.0

atom_types:
  - {type: 1,  label: bhN1, mass: 14.007,   params: {epsilon: {min: 0.1000000071, max: 0.4000000284, init: 0.2000000142}, sigma: 3.2963252376, charge: {min: -1.000, max: -0.543}}}
  - {type: 2,  label: bhHn, mass: 1.008,    params: {epsilon: {min: 0.0236756017, max: 0.0947024066, init: 0.0473512033}, sigma: 0.3980865645, charge: {min:  0.184, max:  0.784}}}
  - {type: 3,  label: bhN2, mass: 14.007,   params: {epsilon: {min: 0.1000000071, max: 0.4000000284, init: 0.2000000142}, sigma: 3.2963252376, charge: {min: -0.351, max:  0.249}}}
  - {type: 4,  label: bhN3, mass: 14.007,   params: {epsilon: {min: 0.1000000071, max: 0.4000000284, init: 0.2000000142}, sigma: 3.2963252376, charge: {min: -0.846, max: -0.246}}}
  - {type: 5,  label: bhC2, mass: 12.01115, params: {epsilon: {min: 0.0494999972, max: 0.1979999888, init: 0.0989999944}, sigma: 3.3141432470, charge: {min: -0.281, max:  0.319}}}
  - {type: 6,  label: bhH2, mass: 1.008,    params: {epsilon: {min: 0.0150000526, max: 0.0600002104, init: 0.0300001052}, sigma: 2.4200365710, charge: {min: -0.203, max:  0.397}}}
