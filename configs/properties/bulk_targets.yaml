# Experimental bulk targets for BTAH.
#
# Delete this include if you want to run an interface-only objective. The bulk
# NPT stage may still be used by the current runner as a stable prerequisite,
# but these targets will not contribute to objective/R2/AL scoring.

targets:
  # value is the experimental/reference target.
  # weight controls importance in weighted RMSE; set weight: 0.0 to keep a
  # target documented but exclude it from fitting.
  # tolerance is used for human screening and later stability analysis.
  a:         {value: 4.2422, weight: 1.0, unit: "A",      tolerance: 0.1}
  b:         {value: 17.827, weight: 1.0, unit: "A",      tolerance: 0.3}
  c:         {value: 20.685, weight: 1.0, unit: "A",      tolerance: 0.3}
  alpha:     {value: 72.63,  weight: 0.5, unit: "degree", tolerance: 1.0}
  beta:      {value: 87.15,  weight: 0.5, unit: "degree", tolerance: 1.0}
  gamma_ang: {value: 86.23,  weight: 0.5, unit: "degree", tolerance: 1.0}
  density:   {value: 1.3285, weight: 1.0, unit: "g/cm3",  tolerance: 0.03}
