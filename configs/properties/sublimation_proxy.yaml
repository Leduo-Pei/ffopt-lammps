# Sublimation/cohesive-energy proxy module.
#
# Current production proxy:
#   esub_proxy = E_single_min - <PE_bulk_NPT>/N_molecules
#
# The production BTAH workflow fits this potential-energy proxy directly to the
# selected 98.5 kJ/mol reference. It is not a rigorously thermally corrected
# standard-state sublimation enthalpy; no empirical offset is applied here.

targets:
  esub_proxy:
    # User-selected fitting target for the PE-based proxy.
    value: 98.5
    # Low weight keeps this as a thermodynamic regularizer during BO.
    weight: 0.3
    unit: "kJ/mol"
    tolerance: 10.0

sublimation:
  enabled: true
  data_files:
    bulk: "data/bulk/BTAH_822_bulk.data"
    single: "data/molecule/BTAH_822_single.data"
  inputs:
    bulk: "lammps/inputs/molecule/in.sublimation.bulk"
    single: "lammps/inputs/molecule/in.sublimation.single"
  molecule_atoms: 14
  # Experimental reference temperature. 298.15 K and 300 K are equivalent for
  # this current proxy.
  target_temperature: 298.15
  # Raw experimental standard sublimation enthalpy reference.
  target_kj_mol: 98.5
  # Keep this at zero unless a separately justified thermochemical correction
  # is intentionally introduced together with a new target definition.
  thermal_correction_kj_mol: 0.0
  tolerance_kj_mol: 10.0
  cutoff: 8.0
  kspace_accuracy: 1.0e-5
