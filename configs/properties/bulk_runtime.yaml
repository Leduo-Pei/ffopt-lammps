# Bulk NPT runtime module.
#
# Include this when the current engine needs the molecular crystal bulk stage.
# It defines how LAMMPS reports bulk observables, but it does NOT add any bulk
# target to the objective. Add bulk_targets.yaml when you want a/b/c/angles/rho
# to participate in BO/NN/AL fitting.

lammps:
  bulk_input: "lammps/inputs/bulk/in.bulk.mol"
  surf_input: "lammps/inputs/surface/in.surf.charged"  # only used if compute_surface=true
  compute_surface: false
  cutoff: 8.0
  timestep: 1.0
  bulk:
    nx: 8
    ny: 2
    nz: 2
    npt_seed: 101
    equil_steps: 20000
    prod_steps: 40000
  surf:
    npt_seed: 101
    equil_steps: 5000
    prod_steps: 10000

output_mapping:
  bulk:
    columns: ["a_0K", "a", "b", "c", "alpha", "beta", "gamma_ang", "density", "pe", "enthalpy"]
    target_keys:
      a: "a"
      b: "b"
      c: "c"
      alpha: "alpha"
      beta: "beta"
      gamma_ang: "gamma_ang"
      density: "density"
  surf:
    E_slab_key: "E_slab"
    A_xy_key: "A_xy"

surf_energy_sanity:
  min: 0.1
  max: 10.0

