[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffopt-lammps"
version = "0.3.0a1"
description = "Restartable force-field parameter optimization with LAMMPS, Bayesian optimization, surrogate models, and active learning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Leduo-Pei", email = "ziyu.pei@gtiit.edu.cn"},
]
keywords = ["LAMMPS", "force field", "Bayesian optimization", "active learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "PyYAML>=6.0",
  "tomli>=2.0; python_version<'3.11'",
  "tomli-w>=1.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
bo = ["torch>=2.2", "botorch>=0.11", "gpytorch>=1.11"]
nn = ["torch>=2.2", "xgboost>=2.0"]
full = [
  "torch>=2.2",
  "botorch>=0.11",
  "gpytorch>=1.11",
  "xgboost>=2.0",
]
dev = ["pytest>=8.0", "build>=1.2", "ruff>=0.6"]

[project.scripts]
ffopt = "ffopt.cli:main"

# Third-party packages may expose PropertyEvaluator instances, classes, or
# zero-argument factories under this entry-point group.
[project.entry-points."ffopt.property_evaluators"]

[project.urls]
Homepage = "https://github.com/Leduo-Pei/ffopt-lammps"
Documentation = "https://github.com/Leduo-Pei/ffopt-lammps/tree/main/docs"
Repository = "https://github.com/Leduo-Pei/ffopt-lammps"
Issues = "https://github.com/Leduo-Pei/ffopt-lammps/issues"
Changelog = "https://github.com/Leduo-Pei/ffopt-lammps/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["ffopt", "engine", "workflow", "utils", "viz"]

[tool.setuptools.package-dir]
ffopt = "src/ffopt"
engine = "engine"
workflow = "workflow"
utils = "utils"
viz = "viz"

[tool.setuptools.data-files]
"share/ffopt/lammps/inputs/bulk" = ["lammps/inputs/bulk/*"]
"share/ffopt/lammps/inputs/molecule" = ["lammps/inputs/molecule/*"]
"share/ffopt/lammps/inputs/adsorption" = ["lammps/inputs/adsorption/*"]
"share/ffopt/examples/btah" = ["examples/btah/*.in"]
"share/ffopt/data/bulk" = ["data/bulk/BTAH_822_bulk.data"]
"share/ffopt/data/molecule" = ["data/molecule/BTAH_822_single.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
