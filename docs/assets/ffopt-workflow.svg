<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1240" viewBox="0 0 1280 1240" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">FFOpt: one framework, material-specific workflows</title>
  <desc id="description">Start from data, parameters and targets in ffopt.in. Molecular BO and sampling generate property labels; BCC adds structural constraints and static elasticity. Train on stored data, select new candidates, calculate them with LAMMPS, and return the new results to training. Final selection uses repeated calculations and material-specific validation. Surrogate training itself does not run molecular dynamics.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#182D35" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#087E83" />
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B4502B" />
    </marker>
  </defs>
  <rect width="1280" height="1240" fill="#FFFFFF" />
  <text x="48" y="65" font-size="39" fill="#182D35" font-weight="700" text-anchor="start">From experimental targets to a tested force field</text>
  <text x="48" y="106" font-size="24" fill="#50646C" font-weight="400" text-anchor="start">Shared execution and data. Material-specific objectives and validation.</text>
  <circle cx="66" cy="161" r="19" fill="#182D35" />
  <text x="66" y="168" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
  <text x="100" y="169" font-size="28" fill="#182D35" font-weight="700" text-anchor="start">Define the material and the fit</text>
  <rect x="48" y="196" width="1184" height="87" rx="6" fill="#F3F6F7" />
  <text x="72" y="231" font-size="26" fill="#182D35" font-weight="700" text-anchor="start">One ffopt.in + LAMMPS data</text>
  <text x="72" y="264" font-size="23" fill="#50646C" font-weight="400" text-anchor="start">Initial parameters and bounds   /   Experimental targets   /   Property modules</text>
  <line x1="640" y1="284" x2="640" y2="316" stroke="#182D35" stroke-width="2" fill="none" marker-end="url(#arrow-ink)" />
  <circle cx="66" cy="349" r="19" fill="#182D35" />
  <text x="66" y="356" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
  <text x="100" y="357" font-size="28" fill="#182D35" font-weight="700" text-anchor="start">Build a material-specific training set</text>
  <rect x="48" y="384" width="574" height="226" rx="6" fill="#EAF6F5" />
  <rect x="48" y="384" width="5" height="226" fill="#087E83" />
  <rect x="658" y="384" width="574" height="226" rx="6" fill="#FCF0E9" />
  <rect x="658" y="384" width="5" height="226" fill="#B4502B" />
  <text x="72" y="425" font-size="29" fill="#087E83" font-weight="700" text-anchor="start">Molecular crystals</text>
  <text x="72" y="463" font-size="25" fill="#182D35" font-weight="700" text-anchor="start">BO search + focused sampling</text>
  <text x="72" y="500" font-size="22" fill="#50646C" font-weight="400" text-anchor="start">Find promising, repeatable parameter regions.</text>
  <text x="72" y="534" font-size="22" fill="#50646C" font-weight="400" text-anchor="start">Calculate the configured molecular properties.</text>
  <text x="72" y="580" font-size="22" fill="#087E83" font-weight="400" text-anchor="start">Bulk  /  Sublimation estimate  /  Adsorption</text>
  <text x="682" y="425" font-size="29" fill="#B4502B" font-weight="700" text-anchor="start">Elemental BCC</text>
  <text x="682" y="463" font-size="24" fill="#182D35" font-weight="700" text-anchor="start">Feasible-region search + elastic screening</text>
  <text x="682" y="500" font-size="22" fill="#50646C" font-weight="400" text-anchor="start">Map allowed structure and surface properties.</text>
  <text x="682" y="534" font-size="22" fill="#50646C" font-weight="400" text-anchor="start">Sample the region; calculate static elasticity.</text>
  <text x="682" y="580" font-size="22" fill="#B4502B" font-weight="400" text-anchor="start">Structural limits first; then mechanical accuracy.</text>
  <text x="640" y="649" font-size="24" fill="#182D35" font-weight="400" text-anchor="middle">BO and sampling call LAMMPS. Their results become the training data.</text>
  <circle cx="66" cy="707" r="19" fill="#182D35" />
  <text x="66" y="714" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
  <text x="100" y="715" font-size="28" fill="#182D35" font-weight="700" text-anchor="start">Learn the response and test new candidates</text>
  <text x="48" y="754" font-size="23" fill="#50646C" font-weight="400" text-anchor="start">Models in the packaged examples: molecular ANN and BCC Gaussian process (GP).</text>
  <line x1="48" y1="786" x2="393" y2="786" stroke="#087E83" stroke-width="4" fill="none" />
  <text x="48" y="825" font-size="27" fill="#087E83" font-weight="700" text-anchor="start">Train the surrogate</text>
  <text x="48" y="862" font-size="21" fill="#50646C" font-weight="400" text-anchor="start">Stored parameters and properties</text>
  <text x="48" y="893" font-size="21" fill="#50646C" font-weight="400" text-anchor="start">Offline learning: no MD per epoch</text>
  <line x1="467" y1="786" x2="812" y2="786" stroke="#182D35" stroke-width="4" fill="none" />
  <text x="467" y="825" font-size="27" fill="#182D35" font-weight="700" text-anchor="start">Choose candidates</text>
  <text x="467" y="862" font-size="21" fill="#50646C" font-weight="400" text-anchor="start">Predicted improvement + uncertainty</text>
  <text x="467" y="893" font-size="21" fill="#50646C" font-weight="400" text-anchor="start">Respect the material constraints</text>
  <line x1="879" y1="786" x2="1224" y2="786" stroke="#B4502B" stroke-width="4" fill="none" />
  <text x="879" y="825" font-size="27" fill="#B4502B" font-weight="700" text-anchor="start">Test with LAMMPS</text>
  <text x="879" y="862" font-size="21" fill="#50646C" font-weight="400" text-anchor="start">Calculate and compare properties</text>
  <text x="879" y="893" font-size="21" fill="#50646C" font-weight="400" text-anchor="start">Add the new results to the dataset</text>
  <line x1="401" y1="824" x2="443" y2="824" stroke="#182D35" stroke-width="2" fill="none" marker-end="url(#arrow-ink)" />
  <line x1="815" y1="824" x2="855" y2="824" stroke="#182D35" stroke-width="2" fill="none" marker-end="url(#arrow-ink)" />
  <path d="M 1217 909 V 962 H 65 V 918" stroke="#087E83" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
  <rect x="370" y="943" width="548" height="37" fill="#FFFFFF" />
  <text x="644" y="969" font-size="21" fill="#087E83" font-weight="400" text-anchor="middle">New physical evidence updates the model</text>
  <circle cx="66" cy="1036" r="19" fill="#182D35" />
  <text x="66" y="1043" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
  <text x="100" y="1044" font-size="28" fill="#182D35" font-weight="700" text-anchor="start">Select, validate and export</text>
  <text x="48" y="1085" font-size="23" fill="#50646C" font-weight="400" text-anchor="start">Repeated molecular evaluations or BCC finite-temperature screening select the finalists.</text>
  <rect x="48" y="1110" width="1184" height="92" rx="6" fill="#182D35" />
  <text x="72" y="1148" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="start">Final LAMMPS validation</text>
  <text x="72" y="1183" font-size="22" fill="#FFFFFF" font-weight="400" text-anchor="start">Resolved parameters   /   Target comparison   /   Structures and trajectories   /   Model limitations</text>
</svg>